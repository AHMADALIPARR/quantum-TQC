# Bell pair |Φ+> prepare and measure both qubits

ir_version = "0.1.0"

[[qregs]]
name = "q"
size = 2

[[cregs]]
name = "c"
size = 2

[[operations]]
gate = "H"
qubits = [{ register = "q", index = 0 }]
source_id = "h0"

[[operations]]
gate = "CNOT"
qubits = [
  { register = "q", index = 0 },
  { register = "q", index = 1 },
]
source_id = "cx0"

[[operations]]
gate = "MEASURE"
qubits = [{ register = "q", index = 0 }]
classical = { register = "c", index = 0 }
source_id = "m0"

[[operations]]
gate = "MEASURE"
qubits = [{ register = "q", index = 1 }]
classical = { register = "c", index = 1 }
source_id = "m1"

[metadata]
name = "bell_pair"
objective = "Prepare Bell state |Φ+> and measure both qubits"
description = "H on q0, CNOT(q0,q1), measure both"
assumptions = ["Ideal simulation"]

[resources]
max_qubits = 4
max_depth = 100
max_gates = 100
