# Algorithm catalog (declarative specs)

[algorithms.grover]
name = "grover"
milestone = 2
description = "Small-instance Grover search"
n_max = 4
assumptions = [
  "Search space N = 2^n with n ≤ 4",
  "Exactly one marked item (or known solution count)",
  "Ideal noiseless simulator",
  "Classical baseline O(N); no asymptotic advantage claimed",
]

[algorithms.grover.iterations]
formula = "floor(pi/4 * sqrt(2^n))"

[algorithms.grover.pipeline]
steps = [
  "Hadamard on all qubits",
  "Repeat: phase-oracle then diffusion",
  "Measure all qubits",
]

[algorithms.grover.spec_fields]
n = "integer 1..4"
marked = "integer in 0..2^n-1"
iterations = "optional override; default optimal"

[algorithms.plus_state]
name = "plus_state"
milestone = 1
description = "Minimal H then MEASURE"
