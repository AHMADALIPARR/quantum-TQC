# Generated circuit checks. Numbers come from statevector simulation of these files' gate sequences.

[grover]
bit_order = "q[0] is the leftmost ket bit (MSB of the marked integer)"
iterations = "floor(pi/4 * sqrt(2^n))"
oracle = "X on zero-bits, multi-controlled Z, uncompute"
diffusion = "H X (multi-controlled Z) X H"

