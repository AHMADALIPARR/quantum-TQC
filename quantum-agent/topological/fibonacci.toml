# Fibonacci anyon model (declarative)

[topological]
model = "fibonacci"
milestone = 3
hardware_claim = false

[topological.anyons]
labels = ["1", "tau"]

[topological.fusion]
rules = [
  { a = "1", b = "1", outcomes = ["1"] },
  { a = "1", b = "tau", outcomes = ["tau"] },
  { a = "tau", b = "1", outcomes = ["tau"] },
  { a = "tau", b = "tau", outcomes = ["1", "tau"] },
]

[topological.quantum_dimension]
"1" = 1.0
tau = 1.618033988749895

[topological.F_matrix_tau]
rows = [
  [0.618033988749895, 0.786151377757423],
  [0.786151377757423, -0.618033988749895],
]

[topological.R_matrix_tau]
diag = [
  [-0.809016994374947, -0.587785252292473],
  [-0.309016994374947,  0.951056516295154],
]

[topological.limits]
n_anyons_max = 4
n_gt_4 = "not supported"
physical_hardware = false
solovay_kitaev = false

[topological.logical_gates]
X = { braid_word = [0, 1, 0], approximate = true, report_error = true }  # skeleton said exact; F,R give fidelity 0.745 to Pauli X
H = { braid_word = [0, 1, 0, 1], approximate = true, report_error = true }

[topological.consistency]
check_F_unitary = true
check_R_unitary = true
check_hexagon = true

# Compiled OpenQASM (global-phase-free u3 of the unitary these matrices define):
#   circuits/topological/f_matrix_tau.qasm
#   circuits/topological/r_matrix_tau.qasm
#   circuits/topological/sigma1.qasm
#   circuits/topological/sigma2.qasm
#   circuits/topological/logical_x_braid_010.qasm
#   circuits/topological/logical_h_braid_0101.qasm
# Checked against Pauli X / H / Z in verification/circuit_checks.toml.
# Under this F and R, braid [0, 1, 0] is not Pauli X
# (average gate fidelity to X = 0.745356, to H = 0.990579).
