[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-quantum-agent"
version = "0.3.0"
description = "Verified Quantum Agent Framework (AGPL-3.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "qutip>=5.0",
  "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
