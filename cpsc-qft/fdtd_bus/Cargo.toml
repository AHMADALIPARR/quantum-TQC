[package]
name = "fdtd_bus"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = { version = "0.32", features = ["serde-serialize"] }
ndarray = { version = "0.15", features = ["serde-1"] }
num-complex = { version = "0.4", features = ["serde"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rustfft = "6"
